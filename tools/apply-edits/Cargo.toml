[package]
name = "apply-edits"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
authors = ["www-agent"]
description = "Apply targeted code edits with multi-line support and atomic transactions"
license = "MIT"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
colored = "=2.1.0"
fs2 = "=0.4.3"
memmap2 = "=0.9.3"
serde = { version = "=1.0.195", features = ["derive"] }
serde_json = "=1.0.111"
strsim = "=0.11.0"
thiserror = "=1.0.56"

[dev-dependencies]
tempfile = "=3.9.0"

[[bin]]
name = "apply-edits"
path = "src/main.rs"

[lib]
name = "apply_edits"
path = "src/lib.rs"
