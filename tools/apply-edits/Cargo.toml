[package]
name = "apply-edits"
version = "0.1.0"
edition = "2021"
authors = ["www-agent"]
description = "Apply targeted code edits with multi-line support"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
colored = "2.1"
strsim = "0.11"
memmap2 = "0.9"

[dev-dependencies]
tempfile = "3.24"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
