# NOTE(jimmylee)
# Cargo configuration for the apply-edits tool.
# This tool provides safe, atomic file editing operations for the Engineer persona.

[package]
name = "apply-edits"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
description = "Transactional code edit engine with atomic rollback support"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
thiserror = "1.0"
strsim = "0.11"
memmap2 = "0.9"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "apply-edits"
path = "src/main.rs"

[lib]
name = "apply_edits"
path = "src/lib.rs"

[profile.release]
lto = true
opt-level = 3
