[package]
name = "apply-edits"
version = "0.2.0"
edition = "2021"
authors = ["www-agent"]
description = "Apply targeted code edits with multi-line support"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strsim = "0.11"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
